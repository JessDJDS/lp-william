  <text x="80" y="498" font-family="Montserrat,Arial,sans-serif" font-weight="500" font-size="26" fill="#A8A091">Mediana por engenharia, por ocupação, por região e por idade —</text>
  <text x="80" y="534" font-family="Montserrat,Arial,sans-serif" font-weight="500" font-size="26" fill="#A8A091">direto dos vínculos formais. Filtra do jeito que quiser.</text>
